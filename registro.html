<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - ACHÓRATE</title>

<!-- Fuente -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<!-- Iconos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- CSS principal -->
<link rel="stylesheet" href="css/style.css">

<link rel="icon" href="Img/Loguito.png">

<style>

/* CONTENEDOR */
.checkout-container {
    max-width: 900px;
    margin: 120px auto;
    background: #111;
    padding: 30px;
    border-radius: 15px;
    color: white;
}

/* ITEMS */
.checkout-item {
    display: flex;
    gap: 15px;
    margin-bottom: 15px;
    align-items: center;
    border-bottom: 1px solid #333;
    padding-bottom: 10px;
}

.checkout-item img {
    width: 70px;
    border-radius: 10px;
}

/* TOTAL */
.checkout-container h2 {
    margin-bottom: 20px;
}

.checkout-container h3 {
    margin-top: 20px;
    margin-bottom: 20px;
}

/* FORMULARIO */
.checkout-form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.checkout-form input {
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: #1a1a1a;
    color: white;
}

.checkout-form input:focus {
    outline: none;
    border: 1px solid #25D366;
}

/* BOTÓN FINAL */
.btn-finalizar {
    background: #25D366;
    color: white;
    padding: 14px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s;
}

.btn-finalizar:hover {
    transform: scale(1.05);
}

/* VOLVER */
.btn-volver {
    display: inline-block;
    margin-top: 20px;
    color: #25D366;
    text-decoration: none;
}

</style>

</head>

<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NJPTSCZV"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div class="checkout-container">

<h2>🧾 Resumen de tu compra</h2>

<div id="checkout-lista"></div>

<h3>Total: S/ <span id="total"></span></h3>

<form action="graciasportucompra.html" class="checkout-form">

<input type="text" placeholder="Nombre completo" required>
<input type="text" placeholder="Número de WhatsApp" required>
<input type="email" placeholder="Correo electrónico" required>
<input type="text" placeholder="Distrito" required>

<button type="submit" class="btn-finalizar">
Finalizar compra
</button>

</form>

<a href="carrito.html" class="btn-volver">← Volver al carrito</a>

</div>

<script>
let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

let contenedor = document.getElementById("checkout-lista");
let total = 0;

carrito.forEach(producto => {
    total += producto.precio;

    contenedor.innerHTML += `
        <div class="checkout-item">
            <img src="${producto.imagen}">
            <div>
                <p>${producto.nombre}</p>
                <strong>S/ ${producto.precio}</strong>
            </div>
        </div>
    `;
});

document.getElementById("total").innerText = total.toFixed(2);
</script>

</body>
</html>
