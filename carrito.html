<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrito</title>

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: #f5f5f5;
}

/* CONTENEDOR */
.carrito-container {
    max-width: 900px;
    margin: 100px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

/* ITEM */
.carrito-item {
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 1px solid #eee;
    padding: 15px 0;
}

.carrito-item img {
    width: 80px;
    border-radius: 8px;
}

.carrito-info {
    flex: 1;
}

.carrito-info h4 {
    margin-bottom: 5px;
}

.carrito-precio {
    font-weight: bold;
}

/* BOTÓN ELIMINAR */
.btn-eliminar {
    background: red;
    color: white;
    border: none;
    padding: 6px 10px;
    cursor: pointer;
    border-radius: 5px;
}

/* TOTAL */
.carrito-total {
    text-align: right;
    margin-top: 20px;
}

.carrito-total h3 {
    margin-bottom: 15px;
}

/* BOTONES */
.btn-comprar {
    background: black;
    color: white;
    padding: 12px 20px;
    border: none;
    cursor: pointer;
    border-radius: 5px;
}

.btn-volver {
    display: inline-block;
    margin-top: 20px;
    text-decoration: none;
    color: black;
}
</style>

</head>
<body>

<div class="carrito-container">

    <h2>🛒 Tu carrito</h2>

    <div id="carrito-lista"></div>

    <div class="carrito-total">
        <h3>Total: S/ <span id="total">0</span></h3>
        <button class="btn-comprar">Finalizar compra</button>
    </div>

    <a href="index.html" class="btn-volver">Seguir comprando</a>

</div>

<script>
// ================= MOSTRAR CARRITO =================
let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

let contenedor = document.getElementById("carrito-lista");
let total = 0;

function renderCarrito() {

    contenedor.innerHTML = "";
    total = 0;

    carrito.forEach((producto, index) => {

        total += producto.precio;

        contenedor.innerHTML += `
            <div class="carrito-item">
                <img src="${producto.imagen}">
                <div class="carrito-info">
                    <h4>${producto.nombre}</h4>
                    <p class="carrito-precio">S/ ${producto.precio}</p>
                </div>
                <button class="btn-eliminar" onclick="eliminar(${index})">X</button>
            </div>
        `;
    });

    document.getElementById("total").innerText = total.toFixed(2);
}

// ================= ELIMINAR =================
function eliminar(index) {
    carrito.splice(index, 1);
    localStorage.setItem("carrito", JSON.stringify(carrito));
    renderCarrito();
}

// INIT
renderCarrito();
</script>

</body>
</html>
