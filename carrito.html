<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrito - ACHÓRATE</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>
body {
    font-family: 'Montserrat', sans-serif;
    background: #0f0f0f;
    color: white;
}

/* CONTENEDOR */
.carrito-container {
    max-width: 900px;
    margin: 120px auto;
    background: #1a1a1a;
    padding: 30px;
    border-radius: 15px;
}

/* ITEM */
.carrito-item {
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 1px solid #333;
    padding: 15px 0;
}

.carrito-item img {
    width: 80px;
    border-radius: 8px;
}

.carrito-info {
    flex: 1;
}

.carrito-precio {
    color: #25D366;
    font-weight: bold;
}

/* BOTÓN ELIMINAR */
.btn-eliminar {
    background: red;
    color: white;
    border: none;
    padding: 6px 10px;
    cursor: pointer;
    border-radius: 5px;
}

/* TOTAL */
.carrito-total {
    text-align: right;
    margin-top: 20px;
}

/* BOTÓN */
.btn-comprar {
    background: #25D366;
    color: white;
    padding: 12px 25px;
    border: none;
    cursor: pointer;
    border-radius: 25px;
    font-weight: 600;
    transition: 0.3s;
}

.btn-comprar:hover {
    transform: scale(1.05);
}

/* VOLVER */
.btn-volver {
    display: inline-block;
    margin-top: 20px;
    color: #aaa;
    text-decoration: none;
}
</style>

</head>

<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NJPTSCZV"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<!-- NAVBAR -->
<header class="navbar">
    <div class="nav-container">
        <img src="Img/LOFO.jpeg" class="logo">

        <nav class="nav-center">
            <a href="index.html#hero">Inicio</a>
            <a href="index.html#nueva">Colección</a>
            <a href="index.html#services">Productos</a>
            <a href="index.html#about">Quiénes somos</a>
        </nav>

        <a href="https://wa.me/+51923458169" target="_blank" class="btn-primary">
            WhatsApp
        </a>
    </div>
</header>

<!-- CARRITO -->
<div class="carrito-container">

    <h2>🛒 Tu carrito</h2>

    <div id="carrito-lista"></div>

    <div class="carrito-total">
        <h3>Total: S/ <span id="total">0</span></h3>

        <button class="btn-comprar" onclick="irRegistro()">
            Finalizar pedido 
        </button>
    </div>

    <a href="index.html" class="btn-volver">← Seguir comprando</a>

</div>

<script>
// IR A REGISTRO
function irRegistro() {
    window.location.href = "registro.html";
}

// MOSTRAR CARRITO
let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
let contenedor = document.getElementById("carrito-lista");
let total = 0;

function renderCarrito() {

    contenedor.innerHTML = "";
    total = 0;

    carrito.forEach((producto, index) => {

        total += producto.precio;

        contenedor.innerHTML += `
            <div class="carrito-item">
                <img src="${producto.imagen}">
                <div class="carrito-info">
                    <h4>${producto.nombre}</h4>
                    <p class="carrito-precio">S/ ${producto.precio}</p>
                </div>
                <button class="btn-eliminar" onclick="eliminar(${index})">X</button>
            </div>
        `;
    });

    document.getElementById("total").innerText = total.toFixed(2);
}

// ELIMINAR
function eliminar(index) {
    carrito.splice(index, 1);
    localStorage.setItem("carrito", JSON.stringify(carrito));
    renderCarrito();
}

// INIT
renderCarrito();
</script>

</body>
</html>
