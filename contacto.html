    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .contact-container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            width: 350px;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .btn-contact {
            display: block;
            margin: 15px 0;
            padding: 15px;
            border-radius: 30px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-contact:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .whatsapp {
            background: #25D366;
        }

        .facebook {
            background: #1877F2;
        }

        .instagram {
            background: #E1306C;
        }

        .btn-contact i {
            margin-right: 10px;
        }
    </style>
</head>
